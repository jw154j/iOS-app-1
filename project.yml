name: SimpleStarterApp
options:
  bundleIdPrefix: com.jasonwhitaker
targets:
  SimpleStarterApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - SimpleStarterApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonwhitaker.simplestarterapp
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SimpleStarterApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
