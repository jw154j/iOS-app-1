workflows:
  ios-simulator-build:
    name: SimpleStarterApp — unsigned simulator build
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Build unsigned simulator app
        script: |
          xcodebuild build \
            -project "SimpleStarterApp.xcodeproj" \
            -scheme "SimpleStarterApp" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
