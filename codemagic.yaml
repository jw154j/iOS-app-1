workflows:
  ios-simulator-build:
    name: SimpleStarterApp — unsigned simulator build
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Build unsigned simulator app
        script: |
          xcodebuild build \
            -project "SimpleStarterApp.xcodeproj" \
            -scheme "SimpleStarterApp" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
    ios-device-unsigned-build:
    name: SimpleStarterApp — unsigned device build
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Build unsigned device app
        script: |
          xcodebuild build \
            -project "SimpleStarterApp.xcodeproj" \
            -scheme "SimpleStarterApp" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into unsigned IPA
        script: |
          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R SimpleStarterApp.app Payload/
          zip -r ../../../../SimpleStarterApp-unsigned.ipa Payload

    artifacts:
      - SimpleStarterApp-unsigned.ipa
